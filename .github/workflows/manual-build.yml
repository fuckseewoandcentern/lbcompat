name: 手动构建

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: CMake 构建类型
        type: choice
        options:
          - Release
          - Debug
        default: Release
      run_tests:
        description: 运行不依赖 LyricsBlossom 本体的测试
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: 编译
    runs-on: ubuntu-latest
    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            g++ \
            libvulkan-dev \
            libx11-dev \
            libdbus-1-dev \
            mesa-vulkan-drivers

      - name: 配置并编译
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ inputs.build_type }}" \
            -DCMAKE_CXX_COMPILER=g++
          cmake --build build

      - name: 运行测试
        if: ${{ inputs.run_tests }}
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          ./build/test_arm64
          ./build/test_macho
          ./build/test_mpris
          ./build/test_metal
          ./build/test_boot

      - name: 上传可执行文件
        uses: actions/upload-artifact@v4
        with:
          name: lbcompat-linux-x64-${{ inputs.build_type }}
          path: |
            build/lbcompat
            build/lb-mpris-bridge
          if-no-files-found: error
